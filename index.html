<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الرخص</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--tx:#18212d;--mu:#667386;--bd:#e3e8ef;--hd:#f7f9fb;
  --ac:#1d5bd6;--acbg:#e8efff;
  --red:#c8283a;--redbg:#fdecee;--amb:#a35f00;--ambbg:#fff4dc;--grn:#16794a;--grnbg:#e4f5ec;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b;--card:#171e28;--tx:#e7ecf3;--mu:#94a1b3;--bd:#27313f;--hd:#1c2531;
  --ac:#6ea2ff;--acbg:#1b2a45;--red:#ff6b78;--redbg:#3a1a1f;--amb:#f2b44c;--ambbg:#382b12;--grn:#5ed394;--grnbg:#12301f;--sh:none}}
:root[data-theme="dark"]{
  --bg:#0f141b;--card:#171e28;--tx:#e7ecf3;--mu:#94a1b3;--bd:#27313f;--hd:#1c2531;
  --ac:#6ea2ff;--acbg:#1b2a45;--red:#ff6b78;--redbg:#3a1a1f;--amb:#f2b44c;--ambbg:#382b12;--grn:#5ed394;--grnbg:#12301f;--sh:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
.w{max-width:1440px;margin:0 auto;padding:24px 16px 40px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:0}
.sub{color:var(--mu);font-size:.88rem;margin-top:2px}
.today{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:.88rem;color:var(--mu);box-shadow:var(--sh)}
.today b{color:var(--tx);font-weight:600}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.c{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;box-shadow:var(--sh)}
.c::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--bd)}
.c b{display:block;font-size:1.9rem;font-weight:700;line-height:1.2}
.c span{font-size:.85rem;color:var(--mu)}
.c.r::before{background:var(--red)}.c.r b{color:var(--red)}
.c.a::before{background:var(--amb)}.c.a b{color:var(--amb)}
.c.g::before{background:var(--grn)}.c.g b{color:var(--grn)}
.c.n::before{background:var(--ac)}

#alert{display:none;background:var(--redbg);border:1px solid var(--red);border-radius:14px;padding:14px 16px;margin-bottom:16px}
#alert h2{margin:0 0 8px;font-size:1rem;font-weight:700;color:var(--red)}
#alert ul{margin:0;padding-inline-start:20px;font-size:.92rem}
#alert li{margin:2px 0}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--mu);font-weight:500}
.bar .grow{flex:1;min-width:180px}
.bar .sp{flex:1}
input,select,button{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);min-height:38px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
button,.btn{cursor:pointer;font-weight:600;background:var(--ac);color:#fff;border-color:var(--ac);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{filter:brightness(1.07)}
button.g{background:var(--card);color:var(--tx);border-color:var(--bd)}
.bar label.btn{color:#fff;flex-direction:row;font-weight:600;font-size:.9rem}
.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--ac);font-size:.9rem;min-height:38px}

.tw{overflow:auto;max-height:72vh;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1780px;font-size:.88rem}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:middle}
thead th{position:sticky;top:0;z-index:2;background:var(--hd);color:var(--mu);font-weight:600;font-size:.8rem;white-space:nowrap}
thead tr.grp th{font-size:.78rem;color:var(--tx);text-align:center;border-bottom:1px solid var(--bd)}
thead tr.grp + tr th{top:37px}
th.gd{background:var(--acbg)}th.gc{background:var(--grnbg)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--hd) 60%,transparent)}
tbody tr:hover td{background:var(--acbg)}
td.nm,th.nm{position:sticky;right:0;z-index:1;background:var(--card)}
thead th.nm{z-index:3;background:var(--hd)}
tbody tr:nth-child(even) td.nm{background:var(--hd)}
td input{width:100%;min-width:90px;border-color:transparent;background:transparent;padding:6px 6px;min-height:34px;border-radius:7px}
td input:hover{border-color:var(--bd)}
td input[type=date]{min-width:136px}
td.nm input{min-width:210px;font-weight:600}
td.k1 input{min-width:150px}td.k2 input{min-width:135px}td.k5 input{min-width:165px}td.k6 input{min-width:64px;width:64px}td.k7 input{min-width:110px}td.k8 input{min-width:115px}td.k11 input{min-width:80px}
tr.al td{background:var(--redbg)!important}
tr.al td.nm{box-shadow:inset -4px 0 0 var(--red)}
.b{display:block;text-align:center;padding:3px 10px;border-radius:999px;font-weight:600;font-size:.8rem;white-space:nowrap}
.b.r{background:var(--red);color:#fff}.b.a{background:var(--ambbg);color:var(--amb)}.b.g{background:var(--grnbg);color:var(--grn)}.b.x{background:var(--bd);color:var(--mu)}
.p{height:4px;border-radius:9px;background:var(--bd);margin-top:5px;overflow:hidden}.p i{display:block;height:100%}
.p i.r{background:var(--red)}.p i.a{background:var(--amb)}.p i.g{background:var(--grn)}
button.x{background:transparent;color:var(--mu);border-color:transparent;padding:4px 8px;min-height:30px;font-weight:500}
button.x:hover{color:var(--red);border-color:var(--red);background:var(--redbg)}
button.x.sure{color:#fff;background:var(--red);border-color:var(--red)}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
footer{color:var(--mu);font-size:.8rem;margin-top:12px}
#toast{position:fixed;inset-inline:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;z-index:9;align-items:center;justify-content:space-between;gap:12px;font-size:.92rem}
#toast button{background:transparent;color:inherit;border:1px solid currentColor;min-height:30px;padding:3px 12px}
@media (max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:1.25rem}.bar .sp{display:none}}
</style>
</head>

function ser(n){if(typeof n==='number'&&n>30000&&n<73050)return new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10);if(typeof n==='string'){var m=n.match(/^\s*(\d{4})-(\d\d)-(\d\d)/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=n.match(/^\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){var y=+m[3];if(y<100)y+=2000;return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2)}}return''}

    var c={n:ix('اسم السائق'),b:ix('المستفيد'),t:ix('نوع الرخصة'),ds:ix('تاريخ الاصدار',1),de:ix('تاريخ الانتهاء',1),ct:ix('نوع السيارة'),m:ix('موديل'),y:ix('سنة الصنع'),p:ix('رقم اللوحة'),l:ix('حروف'),s:ix('المورد'),cs:ix('تاريخ الاصدار2',1),ce:ix('تاريخ الانتهاء3',1),nt:ix('ملاحظات')};
    function g(r,j){return j<0||r[j]==null?'':r[j]}
    out=[];for(var k=h+1;k<rows.length;k++){var r=rows[k];if(!r||!g(r,c.n))continue;
